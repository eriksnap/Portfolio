<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Erik Machowski | Contact</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 fixed-top">
            <a class="navbar-brand" href="index.html">ERIK PORTFOLIO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
                <span id="xp-display" class="text-light ms-3">Level 1 | XP 0/100</span>
            </div>
        </nav>

        <section class="container py-5">
            <h1>Contact</h1>
            <p class="text-muted">Have a project, opportunity, or question? Send a message below.</p>

            <div class="card p-4 mb-5">
                <form id="contact-form" action="https://formspree.io/f/mvzjbrpv" method="POST">
                    <div class="mb-3">
                        <label for="inputName" class="form-label">Name</label>
                        <input id="inputName" name="name" class="form-control" placeholder="Your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputEmail" class="form-label">Email</label>
                        <input id="inputEmail" name="email" type="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputMessage" class="form-label">Message</label>
                        <textarea id="inputMessage" name="message" class="form-control" rows="5" placeholder="Your message..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">Send Message</button>
                    <p id="form-status" class="text-muted small mt-2 mb-0"></p>
                </form>
            </div>

            <h2>Find Me Online</h2>
            <div class="row mt-3">

                <div class="col-md-4">
                    <div class="card p-3 mb-3">
                        <h5>itch.io</h5>
                        <p class="text-muted small mb-2">Play my published games</p>
                        <a href="https://snappyli.itch.io/flashfire"
                           class="btn btn-dark btn-sm"
                           target="_blank"
                           onclick="gainXPOnce('opened_itch', 15)">Snappyli
                        </a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 mb-3">
                        <h5>GitHub</h5>
                        <p class="text-muted small mb-2">Browse my code repositories</p>
                        <a href="https://github.com/eriksnap"
                           class="btn btn-dark btn-sm"
                           target="_blank"
                           onclick="gainXPOnce('opened_github', 10)">Eriksnap
                        </a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-3 mb-3">
                        <h5>LinkedIn</h5>
                        <p class="text-muted small mb-2">Connect professionally</p>
                        <a href="https://www.linkedin.com/in/erik-machowski-6a3248240/"
                           class="btn btn-dark btn-sm"
                           target="_blank"
                           onclick="gainXPOnce('opened_linkedin', 10)">Erik Machowski
                        </a>
                    </div>
                </div>

            </div>
        </section>

        <script src="main.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            //Uses Formspree to manage the message requests
            document.addEventListener("DOMContentLoaded", function() {
                var form = document.getElementById("contact-form");
                var statusEl = document.getElementById("form-status");
                var submitBtn = document.getElementById("submit-btn");

                form.addEventListener("submit", function(e) {
                    e.preventDefault();

                    submitBtn.disabled = true;
                    submitBtn.textContent = "Sending...";
                    statusEl.textContent = "";

                    var formData = new FormData(form);

                    fetch(form.action, {
                        method: "POST",
                        body: formData,
                        headers: {
                            "Accept": "application/json"
                        }
                    })
                    .then(function(response) {
                        if (response.ok) {
                            statusEl.textContent = "Message sent successfully!";
                            statusEl.classList.remove("text-danger");
                            statusEl.classList.add("text-success");
                            form.reset();
                            gainXPOnce("submitted_form", 30);
                        } else {
                            response.json().then(function(data) {
                                statusEl.textContent = "Something went wrong. Please try again or email me directly.";
                                statusEl.classList.add("text-danger");
                                console.log("Formspree error:", data);
                            });
                        }
                    })
                    .catch(function(error) {
                        statusEl.textContent = "Network error. Please try again.";
                        statusEl.classList.add("text-danger");
                        console.log("Fetch error:", error);
                    })
                    .finally(function() {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Send Message";
                    });
                });
            });
        </script>
    </body>
</html>
